[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blobhttp"
version = "0.2.2"
description = "Enterprise HTTP client with rate limiting, SPNEGO auth, and connection pooling"
readme = "README.md"
# 3.11 for the `X | None` annotations in the ctypes layer.
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Paul Harrington"}]
# blobzig is the family's shared ctypes plumbing (artifact discovery, the
# c_void_p result convention) — pure Python, no native code of its own.
dependencies = ["blobzig"]
keywords = ["http", "spnego", "kerberos", "rate-limiting", "duckdb", "sqlite"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Internet :: WWW/HTTP",
]

# The wheel is pure Python plus the prebuilt shared libraries — no compile step
# at install time, so no scikit-build-core, no nanobind, no CMake, and no
# CPython-version matrix. Run `zig build` first.
[tool.hatch.build.targets.wheel]
packages = ["python/blobhttp"]

# hatch_build.py stamps the platform tag and picks which of zig-out/lib belongs
# in this wheel — that directory keeps artifacts from every target ever built.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[dependency-groups]
dev = [
    "duckdb>=1.4.3",
    "flask>=3.0",
    "pytest>=8.0",
]

[tool.uv.sources]
blobzig = { path = "../blobzig", editable = true }
