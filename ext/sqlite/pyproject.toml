[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blobhttp-sqlite"
version = "0.2.2"
description = "HTTP requests and LLM integration as SQL functions — SQLite extension"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Paul Harrington"}]
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["blobhttp_sqlite"]

# No build step and no source list: hatch_build.py force-includes the artifacts
# `zig build` produced at the repo root, and stamps the platform tag. This
# project used to carry its own CMakeLists plus symlinked copies of src/,
# include/ and sqlite_ext/ in order to rebuild what the root build had already
# produced.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
